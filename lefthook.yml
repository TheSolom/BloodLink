# Lefthook configuration for BloodLink polyglot repository
# Documentation: https://lefthook.dev/

pre-commit:
  parallel: false
  commands:
    csharpier:
      glob: "**/*.{cs,csx}"
      run: dotnet csharpier format {staged_files}
      stage_fixed: true

    oxc:
      root: "web/dashboard/"
      glob: "web/dashboard/**/*.{js,ts,jsx,tsx,json,jsonc}"
      run: npx oxfmt --write --no-error-on-unmatched-pattern {staged_files} && npx oxlint --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
