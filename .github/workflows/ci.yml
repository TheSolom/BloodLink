name: BloodLink CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (.NET 11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore BloodLink.slnx

      - name: Build solution
        run: dotnet build BloodLink.slnx --configuration Release --no-restore

      - name: Run unit & architecture tests
        run: dotnet test BloodLink.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          retention-days: 14

  web:
    name: Web Dashboard (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for web changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.web == 'true'
        uses: actions/setup-node@1e60f639196014664a7e158fe7a52f4f1f50acba # v4.0.3
        with:
          node-version-file: 'web/dashboard/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/dashboard/package-lock.json'

      - name: Install dependencies
        if: steps.filter.outputs.web == 'true'
        working-directory: web/dashboard
        run: npm ci

      - name: Run code quality and type check
        if: steps.filter.outputs.web == 'true'
        working-directory: web/dashboard
        run: npm run check

      - name: Run unit & component tests (Vitest)
        if: steps.filter.outputs.web == 'true'
        working-directory: web/dashboard
        run: npm test

      - name: Build production bundle
        if: steps.filter.outputs.web == 'true'
        working-directory: web/dashboard
        run: npm run build

      - name: Security audit production dependencies
        if: steps.filter.outputs.web == 'true'
        working-directory: web/dashboard
        run: npm audit --omit=dev || true
        continue-on-error: true
